    <header>
      <section>
        <div class="top-banner">
          <div class="content">
            <h1>昇華職業</h1>
            <p>
              總共 19
              種全新昇華職業中，每一個都有其獨特的昇華天賦樹。第一次完成帝王的迷宮時，你將能選擇該職業三種昇華職業之一並專精。在各難度下第一次完成迷宮時，你將獲得兩點昇華點數。
            </p>
          </div>
        </div>
      </section>
